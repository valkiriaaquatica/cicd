apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: istio-success-rate
  namespace: rollouts-demo-istio
spec:
  args:
  - name: service
  - name: namespace
  metrics:
  - name: success-rate
    interval: 20s
    count: 3                  # 👈 se ejecutará 3 veces (cada 20s)
    successCondition: result[0] > 0.90
    failureLimit: 1
    provider:
      prometheus:
        address: http://prometheus.istio-system:9090
        query: >+
          sum(irate(istio_requests_total{
            reporter="source",
            destination_service=~"{{args.service}}.{{args.namespace}}.svc.cluster.local",
            response_code!~"5.*"}[40s]))
          /
          sum(irate(istio_requests_total{
            reporter="source",
            destination_service=~"{{args.service}}.{{args.namespace}}.svc.cluster.local"}[40s]))
